<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#f3f4f6" rx="12"/>
  <g transform="translate(50,60)">
    <!-- Car body -->
    <path d="M30 120 L50 60 L100 40 L250 40 L300 60 L320 120 L300 130 L260 130 L240 115 L110 115 L90 130 L50 130 Z" fill="#d1d5db" stroke="#9ca3af" stroke-width="2"/>
    <!-- Roof -->
    <path d="M100 40 L120 20 L230 20 L250 40 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <!-- Windows -->
    <path d="M125 38 L140 24 L220 24 L235 38 Z" fill="#93c5fd" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M105 38 L118 24 L122 24 L122 38 Z" fill="#93c5fd" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- Headlight -->
    <rect x="290" y="70" width="18" height="12" rx="3" fill="#fbbf24" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- Taillight -->
    <rect x="32" y="75" width="12" height="10" rx="2" fill="#f87171" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- Wheel left -->
    <circle cx="95" cy="125" r="22" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="95" cy="125" r="10" fill="#9ca3af"/>
    <circle cx="95" cy="125" r="4" fill="#6b7280"/>
    <!-- Wheel right -->
    <circle cx="255" cy="125" r="22" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="255" cy="125" r="10" fill="#9ca3af"/>
    <circle cx="255" cy="125" r="4" fill="#6b7280"/>
    <!-- Bumper -->
    <line x1="28" y1="110" x2="30" y2="120" stroke="#9ca3af" stroke-width="2"/>
    <line x1="320" y1="110" x2="318" y2="120" stroke="#9ca3af" stroke-width="2"/>
  </g>
</svg>
